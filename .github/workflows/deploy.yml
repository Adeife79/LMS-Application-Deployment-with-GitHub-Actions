name: Application Deployment

on:
    workflow_dispatch:
    #    workflows: ["Continuous Integration"]
     #   types:
     #       - completed
     #   branches:
     #       - main

env:
    AWS_REGION: eu-north-1

jobs:
    deploy:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            
            - name: Debug GitHub OIDC claims
              shell: bash
              run: |
                python3 - <<'PY'
                import os
                import json
                import base64
                import urllib.request

                url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
                token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

                req = urllib.request.Request(
                    url + "&audience=sts.amazonaws.com",
                    headers={"Authorization": f"bearer {token}"}
                )

                with urllib.request.urlopen(req) as response:
                    oidc = json.load(response)

                jwt = oidc["value"]
                payload = jwt.split(".")[1]
                payload += "=" * (-len(payload) % 4)

                claims = json.loads(
                    base64.urlsafe_b64decode(payload)
                )

                for key in ["iss", "aud", "sub", "repository", "repository_owner", "ref"]:
                    print(f"{key}: {claims.get(key)}")
                PY


            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v3
              with:
                role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-role
                aws-region: ${{ env.AWS_REGION }}

            - name: Create EC2 Instance
              run: |
                INSTANCE_ID=$(aws ec2 run-instances \
                  --image-id ${{ secrets.AWS_AMI_ID }} \
                  --instance-type t3.micro \
                  --key-name lms-key \
                  --security-group-ids ${{ secrets.AWS_SECURITY_GROUP_ID }} \
                  --subnet-id ${{ secrets.AWS_SUBNET_ID }} \
                  --associate-public-ip-address \
                  --query 'Instances[0].InstanceId' \
                  --output text \
                  --tag-specifications 'ResourceType=instance, Tags=[{Key=Name,Value=lms-instance}]')

                echo "EC2 Instance created with ID: $INSTANCE_ID"
                echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"


            - name: Describe EC2 Instance
              run: |
                echo "Instance ID: $INSTANCE_ID"

                aws ec2 describe-instances \
                  --instance-ids "$INSTANCE_ID" \
                  --query 'Reservations[0].Instances[0].{State:State.Name,StateReason:StateReason,InstanceType:InstanceType,AMI:ImageId,AZ:Placement.AvailabilityZone}' \
                  --output table

                
            - name: Wait for EC2 Instance to be running
              run: |
                echo "Instance ID: $INSTANCE_ID"
                aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
                echo "EC2 Instance is now running."

            - name: Get EC2 Public DNS
              id: get_public_dns
              run: |
                PUBLIC_DNS=$(aws ec2 describe-instances \
                  --instance-ids "$INSTANCE_ID" \
                  --query 'Reservations[0].Instances[0].PublicDnsName' \
                  --output text)

                echo "Public DNS: $PUBLIC_DNS"

                if [ "$PUBLIC_DNS" = "None" ] || [ -z "$PUBLIC_DNS" ]; then
                  echo "ERROR: EC2 instance does not have a public DNS name"
                  exit 1
                fi

                echo "PUBLIC_DNS=$PUBLIC_DNS" >> "$GITHUB_OUTPUT"


            - name: Get Public IP of EC2 Instance
              id: get_public_ip
              run: |
                echo "Instance ID: $INSTANCE_ID"

                PUBLIC_IP=$(aws ec2 describe-instances \
                  --instance-ids "$INSTANCE_ID" \
                  --query 'Reservations[0].Instances[0].PublicIpAddress'\
                  --output text)
                echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

            - name: Setup SSH Key
              run: |
                mkdir -p ~/.ssh
                echo "${{ secrets.SSH_PRIVATE_KEY}}" > ~/.ssh/id_rsa
                chmod 600 ~/.ssh/id_rsa

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with: 
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Deploy to EC2 via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ steps.get_public_dns.outputs.PUBLIC_DNS }}
                username: ubuntu
                key: ${{ secrets.SSH_PRIVATE_KEY }}
                port: 22
                script: |
                  echo "Successfully connected to EC2 Instance"
                  sudo dnf update -y || true
                  sudo dnf install -y docker || true
                  sudo systemctl start docker || true
                  sudo systemctl enable docker
                  sudo dnf install -y docker-compose || true
                  git clone https://github.com/Adeife79/LMS-Application-Deployment-with-GitHub-Actions.git
                  cd LMS-Application-Deployment-with-GitHub-Actions
                  sudo usermod -aG docker ubuntu
                  sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
                  sudo docker compose pull 
                  sudo docker compose up -d || true




